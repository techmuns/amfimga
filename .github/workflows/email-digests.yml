name: Email digests (hourly)

# Once an hour, ask the deployed Worker to email everyone who is due. The Worker
# does ALL the work — day/time match (IST), the once-per-day guard, and the
# "only when the monthly data actually changed" gate — so this job just pokes it
# with the shared secret. It is idempotent and safe to re-run (a late or double
# run sends nothing extra). No email or data secrets live here: only the poke
# key (DIGEST_KEY) and the site URL (SITE_URL), both repo secrets.

on:
  schedule:
    - cron: "5 * * * *" # every hour at :05 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: email-digests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the digest run
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DIGEST_KEY: ${{ secrets.DIGEST_KEY }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$DIGEST_KEY" ]; then
            echo "SITE_URL or DIGEST_KEY secret not set — the one-time setup isn't complete yet. Skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST "${SITE_URL%/}/api/run-digests" \
            -H "x-digest-key: $DIGEST_KEY" \
            --max-time 120 --retry 2 --retry-delay 5)
          echo "HTTP $code"
          cat /tmp/out.json 2>/dev/null || true
          echo
          test "$code" = "200"
